name: cicd

on:
  push:
    paths:
      - src/**
    branches:
      - main

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - name: My Commit ID
        shell: bash
        run: |
          echo "COMMIT_ID=${GITHUB_SHA::6}" >> "$GITHUB_ENV"
      -
        name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      -
        name: Build and push
        uses: docker/build-push-action@v7
        with:
          push: true
          tags: kamilch84/pe-project-01:${{ env.COMMIT_ID }}
    outputs:
      commit_id: ${{ env.COMMIT_ID }}

  cd:
    needs: ci
    runs-on: self-hosted
    steps:

      - name: checkout code
        uses: actions/checkout@v3

      - name: Update image tag in values.yaml
        shell: bash
        run: |
          sed -i "s/tag:.*/tag: ${{ needs.ci.outputs.commit_id }}/" charts/python-app-helm/values.yaml
      - name: Commit and Push Changes 
        uses: EndBug/add-and-commit@v9
        with:
          message: 'Updates Values.yaml with new image tag ${{ needs.ci.outputs.commit_id }}'

      - name: Install ArgoCD CLI
        shell: bash
        run: |
          curl -ksSL -o argocd https://${{ vars.ARGOCD_ADDRESS }}/download/argocd-linux-amd64
          chmod +x argocd
          sudo mv ./argocd /usr/local/bin/argocd

      - name: ArgoCD app sync
        shell: bash
        run: |
          argocd login ${{ vars.ARGOCD_ADDRESS }} \
            --insecure \
            --grpc-web \
            --username ${{ vars.ARGOCD_USERNAME }} \
            --password ${{ secrets.ARGOCD_PASS }}

          argocd app sync python-app-argo